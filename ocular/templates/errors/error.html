{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container error-page">
  <span class="code">{{ code }}</span>
  <h1 style="font-size:24px">{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="hero-actions" style="justify-content:center">
    <a class="btn btn-primary" href="{{ url_for('pages.home') }}">Back to home</a>
    {% if code == 413 %}<a class="btn btn-ghost" href="{{ url_for('analysis.analyze') }}">Try another image</a>{% endif %}
  </div>
</div>
{% endblock %}
